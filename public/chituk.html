<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#070b14" />
  <title>CHITUK · CORP</title>
  <style>
    :root {
      --paper: #f4e8ce;
      --paper-2: #ead5ad;
      --card: #fffaf0;
      --ink: #30251e;
      --muted: #79695a;
      --clay: #b4563e;
      --clay-deep: #7a3528;
      --ochre: #d69834;
      --sage: #567866;
      --line: #35261d;
      --soft: rgba(53, 38, 29, .17);
      --shadow: 4px 5px 0 rgba(53, 38, 29, .14);
      --serif: Georgia, "Iowan Old Style", "Palatino Linotype", Palatino, serif;
      --sans: "Trebuchet MS", "Avenir Next", Avenir, system-ui, sans-serif;
      --mono: "Courier New", Courier, monospace
    }

    body[data-theme="noche"] {
      --paper: #1e211f;
      --paper-2: #292e2a;
      --card: #f2eadb;
      --ink: #272018;
      --muted: #73675d;
      --clay: #bd624a;
      --clay-deep: #803728;
      --ochre: #d49a3b;
      --sage: #668e78;
      --line: #191b19;
      --soft: rgba(19, 20, 18, .24);
      --shadow: 5px 6px 0 rgba(0, 0, 0, .3)
    }

    body[data-theme="bosque"] {
      --paper: #e5ecdc;
      --paper-2: #cad9ba;
      --card: #fffdf5;
      --ink: #26362d;
      --muted: #627568;
      --clay: #a8563f;
      --clay-deep: #773f31;
      --ochre: #bb8833;
      --sage: #4c7963;
      --line: #2e493c;
      --soft: rgba(46, 73, 60, .18);
      --shadow: 4px 5px 0 rgba(46, 73, 60, .14)
    }

    * {
      box-sizing: border-box
    }

    html {
      scroll-behavior: smooth
    }

    body {
      min-width: 320px;
      margin: 0;
      color: var(--ink);
      background: radial-gradient(circle at 5% 6%, rgba(214, 153, 55, .18), transparent 22rem), radial-gradient(circle at 91% 28%, rgba(180, 86, 62, .12), transparent 26rem), repeating-linear-gradient(0deg, rgba(53, 38, 29, .025) 0, rgba(53, 38, 29, .025) 1px, transparent 1px, transparent 4px), var(--paper);
      font-family: var(--sans);
      line-height: 1.48;
      transition: background .2s, color .2s
    }

    body:before {
      position: fixed;
      z-index: -1;
      inset: 0;
      content: "";
      pointer-events: none;
      opacity: .2;
      background-image: radial-gradient(rgba(50, 37, 28, .38) .55px, transparent .7px);
      background-size: 7px 7px;
      mix-blend-mode: multiply
    }

    button,
    input,
    textarea,
    select {
      font: inherit
    }

    button {
      cursor: pointer
    }

    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible,
    select:focus-visible {
      outline: 3px solid rgba(180, 86, 62, .4);
      outline-offset: 3px
    }

    .shell {
      width: min(1160px, calc(100% - 32px));
      margin: 0 auto
    }

    .masthead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 0 16px;
      border-bottom: 2px solid var(--line)
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      color: inherit;
      text-decoration: none
    }

    .brand-mark {
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      border: 2px solid var(--line);
      border-radius: 48% 52% 43% 57% / 58% 42% 58% 42%;
      color: var(--card);
      background: var(--clay);
      box-shadow: 3px 3px 0 var(--ink);
      font-family: var(--serif);
      font-size: 21px;
      font-weight: 700;
      transform: rotate(-4deg)
    }

    .eyebrow {
      margin: 0;
      color: var(--clay-deep);
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase
    }

    .wordmark {
      display: block;
      margin-top: 1px;
      font-family: var(--serif);
      font-size: 1.55rem;
      font-weight: 700;
      letter-spacing: -.055em;
      line-height: 1
    }

    .top-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap
    }

    .presence {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 9px;
      border: 1.5px solid var(--soft);
      border-radius: 12px 8px 12px 8px;
      background: rgba(255, 250, 240, .52);
      font-size: 10px
    }

    .presence-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--sage);
      box-shadow: 0 0 0 3px rgba(86, 120, 102, .14);
      animation: breathe 2.2s ease-in-out infinite
    }

    .presence strong {
      font-family: var(--mono)
    }

    .small-button,
    .button,
    .chip {
      border: 1.5px solid var(--line);
      color: var(--ink);
      background: transparent;
      font-weight: 800;
      transition: transform .14s ease, box-shadow .14s ease, background .14s ease
    }

    .small-button {
      min-height: 34px;
      padding: 0 10px;
      border-radius: 6px 10px 5px 9px;
      font-size: 11px
    }

    .small-button:hover,
    .button.ghost:hover,
    .chip:hover {
      background: rgba(255, 250, 240, .65);
      transform: translate(-1px, -1px);
      box-shadow: 2px 2px 0 rgba(53, 38, 29, .17)
    }

    .small-button.clay,
    .button.clay {
      color: var(--card);
      background: var(--clay);
      box-shadow: 2px 3px 0 var(--ink)
    }

    .small-button.clay:hover,
    .button.clay:hover {
      background: var(--clay-deep);
      transform: translate(-1px, -1px);
      box-shadow: 3px 4px 0 var(--ink)
    }

    .account-chip {
      display: none;
      align-items: center;
      gap: 7px;
      max-width: 190px;
      padding: 4px 7px 4px 4px;
      border: 1.5px solid var(--soft);
      border-radius: 17px 10px 13px 9px;
      background: rgba(255, 250, 240, .58);
      font-size: 12px;
      font-weight: 800
    }

    .account-chip.visible {
      display: flex
    }

    .avatar {
      display: grid;
      width: 28px;
      height: 28px;
      flex: 0 0 28px;
      place-items: center;
      overflow: hidden;
      border: 1.5px solid var(--line);
      border-radius: 45% 55% 48% 52%;
      background: var(--ochre);
      font-family: var(--serif);
      font-size: 13px
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover
    }

    .account-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    main {
      padding: 28px 0 72px
    }

    .ban-bar,
    .global-bar {
      display: none;
      margin: 0 0 18px;
      padding: 13px 15px;
      border: 1.5px solid var(--line);
      border-radius: 8px 14px 7px 11px;
      background: var(--card);
      box-shadow: var(--shadow)
    }

    .ban-bar.show,
    .global-bar.show {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px
    }

    .ban-bar {
      border-color: var(--clay);
      background: #ffe7dc
    }

    .ban-bar strong,
    .global-bar strong {
      font-family: var(--mono);
      font-size: 11px;
      text-transform: uppercase
    }

    .global-bar p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 13px
    }

    .feed-intro {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      padding-bottom: 18px;
      border-bottom: 2px solid var(--line)
    }

    .feed-intro h1 {
      margin: 4px 0 0;
      font-family: var(--serif);
      font-size: clamp(2.35rem, 6vw, 5rem);
      letter-spacing: -.075em;
      line-height: .88
    }

    .feed-intro h1 em {
      color: var(--clay);
      font-style: italic
    }

    .feed-intro>p {
      max-width: 342px;
      margin: 0 0 2px;
      color: var(--muted);
      font-family: var(--serif);
      font-size: 1rem;
      text-align: right
    }

    .feed-tools {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 20px 0 23px
    }

    .archive-note {
      margin: 0;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 10px;
      text-transform: uppercase
    }

    .project-list {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 22px
    }

    .project-card {
      display: flex;
      min-height: 370px;
      flex-direction: column;
      overflow: hidden;
      border: 1.5px solid var(--line);
      border-radius: 6px 14px 8px 11px;
      background: var(--card);
      box-shadow: 3px 4px 0 rgba(53, 38, 29, .11);
      transition: transform .18s ease, box-shadow .18s ease
    }

    .project-card:nth-child(3n+2) {
      border-radius: 14px 6px 12px 7px;
      transform: rotate(.35deg)
    }

    .project-card:nth-child(3n) {
      border-radius: 9px 16px 5px 12px;
      transform: rotate(-.3deg)
    }

    .project-card:hover {
      position: relative;
      z-index: 1;
      box-shadow: 6px 8px 0 rgba(53, 38, 29, .14);
      transform: translateY(-4px) rotate(0)
    }

    .project-card.announcement {
      border-style: dashed;
      border-color: var(--clay)
    }

    .project-image {
      display: grid;
      height: 146px;
      place-items: center;
      overflow: hidden;
      border-bottom: 1.5px solid var(--line);
      background: linear-gradient(137deg, #d7b66f, #d88961 55%, #77947f)
    }

    .project-image img {
      width: 100%;
      height: 100%;
      object-fit: cover
    }

    .image-placeholder {
      position: relative;
      width: 66px;
      height: 66px;
      border: 2px solid rgba(255, 250, 240, .9);
      border-radius: 46% 54% 42% 58%;
      transform: rotate(-10deg)
    }

    .image-placeholder:before,
    .image-placeholder:after {
      position: absolute;
      content: "";
      border: 2px solid rgba(255, 250, 240, .9)
    }

    .image-placeholder:before {
      inset: 15px;
      border-radius: 50%
    }

    .image-placeholder:after {
      top: 11px;
      right: 12px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255, 250, 240, .9)
    }

    .project-content {
      display: flex;
      flex: 1;
      flex-direction: column;
      padding: 15px 17px 14px
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px
    }

    .card-number,
    .role-tag,
    .verified {
      font-family: var(--mono);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase
    }

    .card-number {
      color: var(--clay-deep)
    }

    .role-tag {
      display: inline-block;
      padding: 2px 5px;
      border: 1px solid var(--soft);
      border-radius: 5px;
      color: var(--muted)
    }

    .role-tag.creator {
      border-color: var(--ochre);
      color: #8a5b13
    }

    .role-tag.admin {
      border-color: var(--sage);
      color: #395f4c
    }

    .verified {
      display: inline-grid;
      width: 16px;
      height: 16px;
      place-items: center;
      border-radius: 50%;
      color: var(--card);
      background: var(--sage);
      font-size: 10px;
      letter-spacing: 0
    }

    .follow {
      padding: 3px 7px;
      border: 1px solid var(--soft);
      border-radius: 8px 5px 8px 5px;
      color: var(--ink);
      background: transparent;
      font-size: 10px;
      font-weight: 800
    }

    .follow.is-following {
      border-color: var(--sage);
      color: #355849;
      background: rgba(86, 120, 102, .1)
    }

    .project-title {
      margin: 9px 0 7px;
      font-family: var(--serif);
      font-size: 1.43rem;
      letter-spacing: -.045em;
      line-height: 1.03;
      overflow-wrap: anywhere
    }

    .project-description {
      display: -webkit-box;
      overflow: hidden;
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 4
    }

    .card-footer {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 9px;
      margin-top: auto;
      padding-top: 13px;
      border-top: 1px solid var(--soft);
      font-size: 10px
    }

    .author-button {
      display: flex;
      align-items: center;
      gap: 6px;
      max-width: 60%;
      overflow: hidden;
      padding: 0;
      border: 0;
      color: var(--ink);
      background: transparent;
      font-weight: 800;
      text-align: left
    }

    .author-button .avatar {
      width: 22px;
      height: 22px;
      flex-basis: 22px;
      font-size: 11px
    }

    .author-name {
      display: flex;
      align-items: center;
      gap: 4px;
      overflow: hidden
    }

    .author-name>span:last-child {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .date {
      color: var(--muted);
      text-align: right
    }

    .card-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 11px
    }

    .text-action,
    .card-mini {
      padding: 0;
      border: 0;
      color: var(--clay-deep);
      background: transparent;
      font-size: 10px;
      font-weight: 800;
      text-decoration: underline;
      text-underline-offset: 3px
    }

    .card-mini {
      padding: 4px 6px;
      border: 1px solid var(--soft);
      border-radius: 5px 8px 5px 7px;
      text-decoration: none
    }

    .card-mini.active {
      border-color: var(--clay);
      background: rgba(180, 86, 62, .1)
    }

    .card-mini.danger {
      border-color: rgba(180, 86, 62, .58);
      color: var(--clay-deep)
    }

    .empty {
      grid-column: 1/-1;
      padding: 52px 24px;
      border: 1.5px dashed rgba(53, 38, 29, .42);
      border-radius: 12px 7px 16px 8px;
      text-align: center
    }

    .empty-mark {
      width: 48px;
      height: 48px;
      margin: 0 auto 14px;
      border: 2px solid var(--ochre);
      border-radius: 50% 43% 52% 46%;
      transform: rotate(12deg)
    }

    .empty h2 {
      margin: 0;
      font-family: var(--serif);
      font-size: 1.6rem;
      letter-spacing: -.04em
    }

    .empty p {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 13px
    }

    .notice {
      display: none;
      position: fixed;
      z-index: 35;
      right: 20px;
      bottom: 20px;
      max-width: min(390px, calc(100% - 40px));
      padding: 12px 14px;
      border: 1.5px solid var(--line);
      border-radius: 8px 13px 7px 11px;
      color: var(--ink);
      background: var(--card);
      box-shadow: var(--shadow);
      font-size: 13px;
      font-weight: 700
    }

    .notice.visible {
      display: block
    }

    .backdrop {
      display: none;
      position: fixed;
      z-index: 30;
      inset: 0;
      overflow: auto;
      padding: 22px;
      background: rgba(45, 35, 28, .46);
      backdrop-filter: blur(3px)
    }

    .backdrop.open {
      display: grid;
      place-items: center
    }

    .modal {
      width: min(680px, 100%);
      max-height: min(840px, calc(100vh - 44px));
      overflow: auto;
      border: 2px solid var(--line);
      border-radius: 9px 17px 10px 14px;
      background: var(--card);
      box-shadow: 7px 8px 0 rgba(38, 27, 20, .38)
    }

    .modal-head {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 16px;
      padding: 22px 23px 17px;
      border-bottom: 1.5px solid var(--line)
    }

    .modal-head h2 {
      margin: 3px 0 0;
      font-family: var(--serif);
      font-size: 2rem;
      letter-spacing: -.06em;
      line-height: .95
    }

    .close {
      display: grid;
      width: 32px;
      height: 32px;
      place-items: center;
      border: 1.5px solid var(--line);
      border-radius: 50% 43% 52% 46%;
      color: var(--ink);
      background: transparent;
      font-size: 20px;
      line-height: 1
    }

    .modal-body {
      padding: 21px 23px 25px
    }

    .tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 20px;
      border-bottom: 1.5px solid var(--soft)
    }

    .tab {
      padding: 0 12px 10px;
      border: 0;
      border-bottom: 3px solid transparent;
      color: var(--muted);
      background: transparent;
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .06em;
      text-transform: uppercase
    }

    .tab.active {
      border-bottom-color: var(--clay);
      color: var(--ink)
    }

    .field {
      display: grid;
      gap: 7px;
      margin-top: 14px
    }

    .field label {
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase
    }

    .field input,
    .field textarea,
    .field select {
      width: 100%;
      border: 1.5px solid var(--soft);
      border-radius: 5px 9px 5px 8px;
      outline: 0;
      color: var(--ink);
      background: #fffdf7
    }

    .field input,
    .field select {
      height: 43px;
      padding: 0 12px
    }

    .field textarea {
      min-height: 106px;
      padding: 11px 12px;
      resize: vertical;
      line-height: 1.48
    }

    .field input:focus,
    .field textarea:focus,
    .field select:focus {
      border-color: var(--clay);
      box-shadow: 0 0 0 3px rgba(180, 86, 62, .14)
    }

    .field small {
      color: var(--muted);
      font-size: 11px
    }

    .form-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 21px
    }

    .form-status {
      min-height: 18px;
      margin: 12px 0 0;
      color: var(--clay-deep);
      font-size: 12px;
      font-weight: 700
    }

    .button {
      min-height: 42px;
      padding: 0 16px;
      border-radius: 5px 11px 5px 9px
    }

    .button:active,
    .small-button:active,
    .chip:active {
      transform: translate(2px, 2px);
      box-shadow: none
    }

    .upload-line {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 17px
    }

    .upload-label {
      display: inline-flex;
      align-items: center;
      padding: 8px 10px;
      border: 1.5px dashed rgba(53, 38, 29, .47);
      border-radius: 8px 5px 10px 6px;
      font-size: 12px;
      font-weight: 700
    }

    .upload-label input {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      opacity: 0
    }

    .file-name {
      overflow: hidden;
      color: var(--muted);
      font-size: 11px;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .project-meta {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 18px
    }

    .project-meta div {
      padding: 10px;
      border: 1px solid var(--soft);
      border-radius: 7px 10px 6px 9px;
      background: rgba(244, 232, 206, .5)
    }

    .project-meta strong {
      display: block;
      font-family: var(--serif);
      font-size: 1.3rem;
      line-height: 1
    }

    .project-meta span {
      color: var(--muted);
      font-family: var(--mono);
      font-size: 9px;
      text-transform: uppercase
    }

    .profile-hero {
      display: flex;
      align-items: center;
      gap: 13px;
      margin-bottom: 17px
    }

    .profile-hero .avatar {
      width: 53px;
      height: 53px;
      flex-basis: 53px;
      font-size: 25px
    }

    .profile-hero h3 {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 0;
      font-family: var(--serif);
      font-size: 1.8rem;
      letter-spacing: -.06em;
      line-height: 1
    }

    .profile-hero p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 12px
    }

    .admin-section {
      margin-top: 21px
    }

    .admin-section h3 {
      margin: 0 0 9px;
      font-family: var(--serif);
      font-size: 1.35rem;
      letter-spacing: -.04em
    }

    .admin-row,
    .comment,
    .message {
      padding: 12px 0;
      border-top: 1px solid var(--soft)
    }

    .admin-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px
    }

    .admin-row p,
    .comment p,
    .message p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 12px
    }

    .row-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: end;
      gap: 5px
    }

    .mini {
      min-height: 29px;
      padding: 0 8px;
      border: 1px solid var(--soft);
      border-radius: 6px 9px 5px 8px;
      color: var(--ink);
      background: transparent;
      font-size: 10px;
      font-weight: 800
    }

      function shareProject(projectId) { var project = state.db.projects.find(function (item) { return item.id === projectId }); if (!project) { return } project.shares = (project.shares || 0) + 1; save(); var text = "CHITUK · " + project.title + " — " + project.description, url = projectShareUrl(project); if (navigator.share) { navigator.share({ title: project.title, text: text, url: url }).catch(function () { }) } else if (navigator.clipboard) { navigator.clipboard.writeText(url).then(function () { notify("Enlace de publicación copiado para compartir.") }).catch(function () { notify("Comparte: " + url) }) } else { notify("Comparte: " + url) } renderFeed() }
      function deleteProject(projectId) { var user = currentUser(); if (!canModerate(user)) { notify("Solo Creator y Admin pueden eliminar proyectos."); return } var project = state.db.projects.find(function (item) { return item.id === projectId }); if (!project) { return } if (!confirm("¿Eliminar definitivamente «" + project.title + "»?")) { return } state.db.projects = state.db.projects.filter(function (item) { return item.id !== projectId }); state.db.comments = state.db.comments.filter(function (item) { return item.projectId !== projectId }); state.db.users.forEach(function (member) { member.savedProjects = member.savedProjects.filter(function (item) { return item !== projectId }); member.unlockedScripts = member.unlockedScripts.filter(function (item) { return item !== projectId }) }); save(); renderAll(); closeModal(); notify("Publicación eliminada.") }
      function action(event) { var trigger = event.target.closest("button[data-action]"); if (!trigger) { return } var name = trigger.dataset.action; if (name === "auth-login") { openAuth("login") } else if (name === "auth-signup") { openAuth("signup") } else if (name === "comments") { openComments(trigger.dataset.projectId) } else if (name === "comment-login") { openAuth("login") } else if (name === "profile") { openProfile(trigger.dataset.userId) } else if (name === "follow") { toggleFollow(trigger.dataset.userId) } else if (name === "like") { toggleLike(trigger.dataset.projectId) } else if (name === "save-project") { toggleSave(trigger.dataset.projectId) } else if (name === "share") { shareProject(trigger.dataset.projectId) } else if (name === "copy-script") { copyScript(state.db.projects.find(function (item) { return item.id === trigger.dataset.projectId })) } else if (name === "get-announcement") { openAnnouncement(state.db.projects.find(function (item) { return item.id === trigger.dataset.projectId })) } else if (name === "script") { var project = state.db.projects.find(function (item) { return item.id === trigger.dataset.projectId }); if (project) { scriptView(project) } } else if (name === "edit-project") { var editProject = state.db.projects.find(function (item) { return item.id === trigger.dataset.projectId }); if (editProject && currentUser() && editProject.authorId === currentUser().id) { openPublish(editProject) } } else if (name === "delete-project") { deleteProject(trigger.dataset.projectId) } else if (name === "edit-profile") { editProfile() } else if (name === "saved-list") { savedView() } else if (name === "admin") { adminView() } else if (name === "support") { openSupport() } else if (name === "theme") { setTheme(trigger.dataset.theme); closeModal() } else if (name === "open-channel") { window.open(trigger.dataset.url, "_blank", "noopener,noreferrer") } else if (name === "unlock-script") { var projectToUnlock = state.db.projects.find(function (item) { return item.id === trigger.dataset.projectId }), member = currentUser(); if (allowed(member) && projectToUnlock) { if (member.unlockedScripts.indexOf(projectToUnlock.id) === -1) { member.unlockedScripts.push(projectToUnlock.id); recordUnlock(projectToUnlock); save() } scriptView(projectToUnlock); notify("Script desbloqueado de forma permanente para esta cuenta.") } } else if (name === "toggle-admin") { var creator = currentUser(), memberToRole = state.db.users.find(function (item) { return item.id === trigger.dataset.userId }); if (isCreator(creator) && memberToRole && memberToRole.role !== "creator") { memberToRole.role = memberToRole.role === "admin" ? "user" : "admin"; save(); adminView(); renderAll(); notify(memberToRole.role === "admin" ? "Rol Admin otorgado." : "Rol Admin retirado.") } } else if (name === "toggle-verified") { var moderator = currentUser(), memberToVerify = state.db.users.find(function (item) { return item.id === trigger.dataset.userId }); if (canModerate(moderator) && memberToVerify) { memberToVerify.verified = !memberToVerify.verified; save(); adminView(); renderAll(); notify(memberToVerify.verified ? "Cuenta verificada." : "Insignia retirada.") } } else if (name === "toggle-ban") { var mod = currentUser(), memberToBan = state.db.users.find(function (item) { return item.id === trigger.dataset.userId }); if (canModerate(mod) && memberToBan && memberToBan.role !== "creator") { memberToBan.banned = !memberToBan.banned; memberToBan.banReason = memberToBan.banned ? "Un administrador restringió esta cuenta." : ""; save(); adminView(); renderAll(); notify(memberToBan.banned ? "La cuenta fue baneada." : "La cuenta fue desbaneada.") } } else if (name === "global-message") { openGlobalMessage() } else if (name === "clear-global") { state.db.announcement = null; save(); renderAll(); closeModal(); notify("Mensaje global retirado.") } else if (name === "open-project") { goToProject(trigger.dataset.projectId) } }
      async function updatePresence() { var now = Date.now(), myKey = metricViewer(); try { var result = await window.storage.get(PRESENCE_KEY, true); var presence = result ? safeParse(result.value, {}) : {}; Object.keys(presence).forEach(function (key) { if (now - presence[key] > PRESENCE_WINDOW) { delete presence[key] } }); presence[myKey] = now; await window.storage.set(PRESENCE_KEY, JSON.stringify(presence), true); $("online-count").textContent = String(Object.keys(presence).length || 1) } catch (error) { $("online-count").textContent = $("online-count").textContent || "1" } }
      function renderAll() { applyTheme(); renderHeader(); renderNotices(); renderFeed() }
      document.addEventListener("click", action); $("open-auth").addEventListener("click", function () { if (currentUser()) { setSession(null); notify("Sesión cerrada.") } else { openAuth("login") } }); $("open-publish").addEventListener("click", function () { openPublish(null) }); $("feed-account-action").addEventListener("click", function () { var user = currentUser(); if (user) { openProfile(user.id) } else { openAuth("signup") } }); $("account-chip").addEventListener("click", function () { var user = currentUser(); if (user) { openProfile(user.id) } }); $("theme-button").addEventListener("click", themeView); $("support-button").addEventListener("click", openSupport); $("close-modal").addEventListener("click", closeModal); modal.addEventListener("click", function (event) { if (event.target === modal) { closeModal() } }); window.addEventListener("keydown", function (event) { if (event.key === "Escape" && modal.classList.contains("open")) { closeModal() } }); window.addEventListener("hashchange", openLinkedProject); if (channel) { channel.onmessage = function (event) { var data = event.data || {}; if (data.type === "sync") { load().then(renderAll) } } }
      load().then(function () { renderAll(); openLinkedProject(); updatePresence(); setInterval(updatePresence, 5000); setInterval(pollRemote, 4000) });
